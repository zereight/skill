<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; width: 1280px; height: 720px; overflow: hidden;
    background: #050814; color: #f4f1ea;
    font-family: "Apple SD Gothic Neo", sans-serif;
  }
  main {
    box-sizing: border-box; height: 100%;
    padding: 72px 80px; display: flex; flex-direction: column; gap: 28px;
  }
  .kicker { color: #3FE0C5; font-size: 22px; letter-spacing: 0.08em; }
  h1 { margin: 0; font-size: 64px; line-height: 1.15; }
  p { margin: 0; font-size: 34px; line-height: 1.45; white-space: pre-wrap; }
  pre {
    margin: 0; padding: 24px; overflow: hidden;
    background: #0c1224; color: #FFB347;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 22px; line-height: 1.4; border-radius: 12px;
  }
</style>
</head>
<body>
<main>
  <div class="kicker">zer 저장소 설명</div>
  <h1>고친 것</h1>
  <p>manifest는 base와 HEAD 사이 커밋 diff에서 파일·hunk·scope를 JSON으로 뽑고, verify는 finding JSON의 줄이 그 hunk 안인지 판정한다.</p>
  <pre>zer manifest --repo . --base origin/main --out manifest.json
zer verify --manifest manifest.json \
  --findings findings.json --out verdict.json</pre>
</main>
</body>
</html>
